name: Build Site Library

on:
  schedule:
    - cron: "0 6 * * *"   # once a day at 06:00 UTC — this is a catalog, not a monitor
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches: [main]       # run once on setup so library.json isn't empty

permissions:
  contents: write

concurrency:
  group: build-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build library.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/build_library.py

      - name: Commit updated library.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library.json
          git diff --staged --quiet || git commit -m "chore: refresh site library [skip ci]"
          git push
